[project]
name = "mcpgate"
version = "0.1.0"
description = "Production-grade MCP server with OAuth 2.1, scoped permissions, row-level policy, rate limits, and tamper-evident audit logs"
readme = "README.md"
authors = [
    { name = "Harsha Moparthy", email = "harsha-moparthy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
mcpgate = "mcpgate.cli:app"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
